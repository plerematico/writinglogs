<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extensive Writing</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #d7dde5;
      --text: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 48px 20px 64px;
      min-height: 100vh;
    }

    .version-badge {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.08);
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.02em;
      pointer-events: none;
      user-select: none;
    }

    .app {
      width: min(900px, 100%);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      font-weight: 700;
      margin: 0 0 12px;
      text-align: center;
      letter-spacing: -0.01em;
    }

    .instructions {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    .instructions ol {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
      line-height: 1.6;
    }

    .writing-area {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 32px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .writing-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      min-height: 260px;
      max-height: 60vh;
      resize: none;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font: 16px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
      flex: 1 1 auto;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .footer-panel {
      display: flex;
      gap: 12px;
      align-items: stretch;
      flex-wrap: wrap;
      position: sticky;
      bottom: 0;
      padding-top: 4px;
      background: linear-gradient(180deg, rgba(248, 250, 252, 0) 0%, #f8fafc 24%);
    }

    .counter-box {
      flex: 1 1 260px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 6px 18px rgba(15, 23, 42, 0.05);
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
    }

    .counter-label {
      color: var(--muted);
      font-weight: 500;
      margin-right: 8px;
    }

    .download-btn {
      flex: 0 0 auto;
      align-self: stretch;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
      transition: transform 120ms ease, box-shadow 150ms ease, background 120ms ease;
    }

    .download-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.28);
      background: #1d4ed8;
    }

    .download-btn:active {
      transform: translateY(0);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    @media (max-width: 640px) {
      body {
        padding: 28px 14px 48px;
      }

      .footer-panel {
        flex-direction: column;
      }

      .download-btn {
        width: 100%;
        text-align: center;
        padding: 14px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="version-badge" aria-hidden="true">v5</div>
  <div class="app">
    <h1>Extensive Writing</h1>
    <div class="instructions">
      <ol>
        <li>Write here</li>
        <li>Don't worry about grammar or spelling</li>
      </ol>
    </div>

    <div class="writing-area">
      <label class="writing-label" for="writer">Start writing</label>
      <textarea
        id="writer"
        aria-label="Writing area"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="none"
        autocomplete="off"
        inputmode="text"
        data-gramm="false"
        data-gramm_editor="false"
        data-enable-grammarly="false"
        data-lt-active="false"
        placeholder="Your thoughts go here..."
      ></textarea>

      <div class="footer-panel">
        <div class="counter-box" aria-live="polite">
          <span class="counter-label">Words</span>
          <span id="word-count">0</span>
        </div>
        <button class="download-btn" id="download">Download</button>
      </div>
    </div>
  </div>

  <script>
    const textarea = document.getElementById('writer');
    const wordCountEl = document.getElementById('word-count');
    const downloadBtn = document.getElementById('download');

    const disableCheckers = (node) => {
      if (!node) return;
      node.setAttribute('spellcheck', 'false');
      node.setAttribute('autocorrect', 'off');
      node.setAttribute('autocapitalize', 'none');
      node.setAttribute('autocomplete', 'off');
      node.setAttribute('inputmode', 'text');
      node.setAttribute('data-gramm', 'false');
      node.setAttribute('data-gramm_editor', 'false');
      node.setAttribute('data-enable-grammarly', 'false');
      node.setAttribute('data-lt-active', 'false');
      node.spellcheck = false;
      node.autocapitalize = 'none';
      node.autocomplete = 'off';
    };

    const getMaxEditorHeight = () => Math.max(window.innerHeight * 0.6, 260);

    const autoResize = () => {
      const maxHeight = getMaxEditorHeight();
      textarea.style.height = 'auto';
      const nextHeight = Math.min(textarea.scrollHeight, maxHeight);
      textarea.style.height = `${nextHeight}px`;
    };

    const countWords = (text) => {
      const words = text
        .trim()
        .split(/\s+/)
        .filter(Boolean);
      return words.length;
    };

    const logging = (() => {
      const eventLog = [];
      let sessionStarted = false;
      let sessionStartTime = 0;
      let lastTextChangeTime = 0;
      let lastValue = textarea.value;
      let pasteEvents = 0;
      let pastedCharacters = 0;
      let backspaceCount = 0;
      let deleteCount = 0;
      let totalAddedChars = 0;
      let totalDeletedChars = 0;
      let charsTypedExcludingPaste = 0;
      const minuteBuckets = new Map();

      const allowedKeys = new Set([
        'Backspace',
        'Delete',
        'Enter',
        ' ',
        'Tab',
        'ArrowLeft',
        'ArrowRight',
        'ArrowUp',
        'ArrowDown',
      ]);

      const shortcutKeys = new Set(['c', 'x', 'v', 'z', 'y', 'a']);

      const ensureSessionStarted = (timestamp) => {
        if (sessionStarted) return;
        sessionStarted = true;
        sessionStartTime = timestamp;
        lastTextChangeTime = 0;
      };

      const relativeTime = () => (sessionStarted ? performance.now() - sessionStartTime : 0);

      const logEvent = (entry) => {
        if (!sessionStarted) return;
        eventLog.push({
          t: Number(relativeTime().toFixed(2)),
          ...entry,
        });
      };

      const handlePauseCheck = (timestamp) => {
        if (!sessionStarted) return;
        if (!lastTextChangeTime) {
          lastTextChangeTime = timestamp;
          return;
        }
        const delta = timestamp - lastTextChangeTime;
        if (delta >= 2000) {
          logEvent({
            type: 'pause',
            data: {
              durationMs: Math.round(delta),
              startMs: Math.max(0, Math.round(lastTextChangeTime - sessionStartTime)),
            },
          });
        }
        lastTextChangeTime = timestamp;
      };

      const handleKeydown = (event) => {
        const isCharacter = event.key.length === 1 && !event.ctrlKey && !event.metaKey;
        const isTrackedKey = isCharacter || allowedKeys.has(event.key);
        const isShortcut = (event.ctrlKey || event.metaKey) && shortcutKeys.has(event.key.toLowerCase());
        if (!(isTrackedKey || isShortcut)) return;

        if (!sessionStarted) return;

        logEvent({
          type: 'keydown',
          data: {
            key: event.key,
            code: event.code,
            ctrl: event.ctrlKey,
            meta: event.metaKey,
            alt: event.altKey,
            shift: event.shiftKey,
            shortcut: isShortcut,
          },
        });

        if (isShortcut) {
          const key = event.key.toLowerCase();
          const actionMap = {
            c: 'copy',
            x: 'cut',
            v: 'paste',
            z: 'undo',
            y: 'redo',
            a: 'select_all',
          };
          const action = actionMap[key];
          if (action) {
            logEvent({
              type: 'shortcut',
              data: { action },
            });
          }
        }
      };

      const handleInput = (event) => {
        if (!['insertText', 'deleteContentBackward', 'deleteContentForward', 'insertFromPaste', 'insertLineBreak', 'insertParagraph'].includes(event.inputType)) {
          lastValue = textarea.value;
          return;
        }

        const nowTime = performance.now();
        const previousValue = lastValue;
        const currentValue = textarea.value;
        const added = Math.max(currentValue.length - previousValue.length, 0);
        const removed = Math.max(previousValue.length - currentValue.length, 0);

        if (!sessionStarted) {
          if (added > 0 || event.inputType === 'insertLineBreak' || event.inputType === 'insertParagraph') {
            ensureSessionStarted(nowTime);
          } else {
            lastValue = currentValue;
            return;
          }
        }

        if (!sessionStarted) {
          lastValue = currentValue;
          return;
        }

        if (added === 0 && removed === 0) {
          lastValue = currentValue;
          return;
        }

        handlePauseCheck(nowTime);

        logEvent({
          type: 'input',
          data: {
            inputType: event.inputType,
            added,
            removed,
          },
        });

        totalAddedChars += added;
        totalDeletedChars += removed;

        if (event.inputType === 'insertFromPaste') {
          pasteEvents += 1;
          pastedCharacters += added;
        } else if (added > 0) {
          charsTypedExcludingPaste += added;
          const minuteIndex = Math.floor((nowTime - sessionStartTime) / 60000);
          const prevChars = minuteBuckets.get(minuteIndex) || 0;
          minuteBuckets.set(minuteIndex, prevChars + added);
        }

        if (event.inputType === 'deleteContentBackward' && removed > 0) {
          backspaceCount += 1;
        }
        if (event.inputType === 'deleteContentForward' && removed > 0) {
          deleteCount += 1;
        }

        lastValue = currentValue;
      };

      const handleFocus = (type) => {
        logEvent({ type, data: {} });
      };

      const computeMinuteWpm = (durationMs) => {
        if (!sessionStarted) return [];
        const totalMinutes = Math.max(Math.ceil(durationMs / 60000), 1);
        const result = [];
        for (let i = 0; i < totalMinutes; i += 1) {
          const charsTyped = minuteBuckets.get(i) || 0;
          const minuteStart = i * 60000;
          const minuteEnd = Math.min((i + 1) * 60000, durationMs);
          const minuteDuration = Math.max(minuteEnd - minuteStart, 1);
          const wordsFromChars = charsTyped / 5;
          const wpm = wordsFromChars / (minuteDuration / 60000);
          result.push(Number(wpm.toFixed(2)));
        }
        return result;
      };

      const getMetrics = () => {
        const nowTime = performance.now();
        const durationMs = sessionStarted ? nowTime - sessionStartTime : 0;
        const totalWords = countWords(textarea.value);
        const totalCharsTyped = totalAddedChars;
        const totalPauses = eventLog.filter((evt) => evt.type === 'pause');
        const pauseDurations = totalPauses.map((p) => p.data.durationMs || 0);
        const totalPausedTime = pauseDurations.reduce((a, b) => a + b, 0);
        const averagePause = pauseDurations.length ? totalPausedTime / pauseDurations.length : 0;
        const longestPause = pauseDurations.length ? Math.max(...pauseDurations) : 0;
        const totalCorrections = backspaceCount + deleteCount;
        const minuteByMinute = computeMinuteWpm(durationMs);
        const pauseSegments = totalPauses.map((p) => ({
          startMs: p.data.startMs || 0,
          durationMs: p.data.durationMs || 0,
        }));
        return {
          durationMs,
          totalCharsTyped,
          charsTypedExcludingPaste,
          deletedCharacters: totalDeletedChars,
          totalWords,
          finalCharacters: textarea.value.length,
          overallWpm: durationMs > 0 ? Number((totalWords / (durationMs / 60000)).toFixed(2)) : 0,
          minuteByMinute,
          backspaceCount,
          deleteCount,
          correctionRatio: charsTypedExcludingPaste > 0 ? Number(((totalDeletedChars / charsTypedExcludingPaste) * 100).toFixed(2)) : 0,
          pasteEvents,
          pastedCharacters,
          pastePercentage: totalCharsTyped > 0 ? Number(((pastedCharacters / totalCharsTyped) * 100).toFixed(2)) : 0,
          pauseCount: totalPauses.length,
          averagePause,
          longestPause,
          totalPausedTime,
          pauseSegments,
        };
      };

      const init = () => {
        textarea.addEventListener('keydown', handleKeydown, true);
        textarea.addEventListener('input', handleInput);
        textarea.addEventListener('focus', () => handleFocus('focus_gained'));
        textarea.addEventListener('blur', () => handleFocus('focus_lost'));
      };

      return { init, getMetrics };
    })();

    const updateCount = () => {
      const total = countWords(textarea.value);
      wordCountEl.textContent = total.toLocaleString('en');
    };

    textarea.addEventListener('input', () => {
      autoResize();
      updateCount();
    });

    textarea.addEventListener('focus', () => disableCheckers(textarea));
    disableCheckers(textarea);

    const { jsPDF } = window.jspdf || {};

    logging.init();

    window.addEventListener('resize', autoResize);

    downloadBtn.addEventListener('click', () => {
      if (!jsPDF) {
        alert('PDF library failed to load. Please try again.');
        return;
      }

      const metrics = logging.getMetrics();
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });
      const margin = 40;
      const lineHeight = 18;
      const maxWidth = doc.internal.pageSize.getWidth() - margin * 2;

      const text = textarea.value || '';
      const wordTotal = countWords(text);

      const lines = doc.splitTextToSize(text || ' ', maxWidth);
      let cursorY = margin;

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.text('Extensive Writing', margin, cursorY);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(12);
      cursorY += lineHeight * 1.6;

      doc.text(`Words: ${wordTotal}`, margin, cursorY);
      cursorY += lineHeight * 1.4;

      lines.forEach((line) => {
        if (cursorY > doc.internal.pageSize.getHeight() - margin) {
          doc.addPage();
          cursorY = margin;
        }
        doc.text(line, margin, cursorY);
        cursorY += lineHeight;
      });

      doc.addPage();
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.text('Session Report', margin, margin);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(12);
      let reportY = margin + lineHeight * 1.5;

      const formatDuration = (ms) => {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      };

      const formatSeconds = (ms) => `${(ms / 1000).toFixed(1)}s`;

      const linesReport = [
        `Total time: ${formatDuration(metrics.durationMs)}`,
        `Total words: ${metrics.totalWords}`,
        `Overall WPM: ${metrics.overallWpm}`,
        `Backspace count: ${metrics.backspaceCount}`,
        `Delete count: ${metrics.deleteCount}`,
        `Corrections ratio: ${metrics.correctionRatio}%`,
        `Paste events: ${metrics.pasteEvents}`,
        `Pasted characters: ${metrics.pastedCharacters}`,
        `Paste percentage: ${metrics.pastePercentage}%`,
        `Pauses: ${metrics.pauseCount}`,
        `Average pause: ${formatSeconds(metrics.averagePause)}`,
        `Longest pause: ${formatSeconds(metrics.longestPause)}`,
        `Total paused time: ${formatSeconds(metrics.totalPausedTime)}`,
      ];

      const pageHeight = doc.internal.pageSize.getHeight();

      linesReport.forEach((line) => {
        if (reportY > pageHeight - margin) {
          doc.addPage();
          reportY = margin;
        }
        doc.text(line, margin, reportY);
        reportY += lineHeight;
      });

      reportY += lineHeight * 0.5;
      const renderTableRow = (text) => {
        if (reportY > pageHeight - margin) {
          doc.addPage();
          reportY = margin;
        }
        doc.text(text, margin, reportY);
        reportY += lineHeight;
      };

      doc.setFont('helvetica', 'bold');
      doc.text('Minute-by-minute WPM', margin, reportY);
      doc.setFont('helvetica', 'normal');
      reportY += lineHeight;

      const tableHeaders = ['Minute', 'WPM'];
      renderTableRow(`${tableHeaders[0]} | ${tableHeaders[1]}`);

      metrics.minuteByMinute.forEach((value, index) => {
        renderTableRow(`${index + 1} | ${value}`);
      });

      doc.addPage();
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.text('Writing Timeline', margin, margin);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(12);

      const graphTop = margin + lineHeight * 1.5;
      const graphHeight = 240;
      const graphLeft = margin;
      const graphWidth = doc.internal.pageSize.getWidth() - margin * 2;
      const graphBottom = graphTop + graphHeight;
      const durationMs = Math.max(metrics.durationMs, 1);
      const durationMinutes = durationMs / 60000;
      const mapTimeToX = (timeMs) => graphLeft + (Math.min(timeMs, durationMs) / durationMs) * graphWidth;

      const maxWpm = metrics.minuteByMinute.length ? Math.max(...metrics.minuteByMinute) : 0;
      const yMax = Math.max(Math.ceil(maxWpm / 10) * 10 || 10, 10);
      const mapWpmToY = (wpm) => graphBottom - (Math.min(wpm, yMax) / yMax) * graphHeight;

      // Axes
      doc.line(graphLeft, graphTop, graphLeft, graphBottom);
      doc.line(graphLeft, graphBottom, graphLeft + graphWidth, graphBottom);

      // Y-axis ticks
      const yTicks = 5;
      for (let i = 0; i <= yTicks; i += 1) {
        const value = (yMax / yTicks) * i;
        const y = mapWpmToY(value);
        doc.line(graphLeft - 5, y, graphLeft, y);
        doc.text(String(Math.round(value)), graphLeft - 10, y + 4, { align: 'right' });
      }

      // X-axis ticks
      const minuteTicks = Math.max(Math.ceil(durationMinutes), 1);
      for (let i = 0; i <= minuteTicks; i += 1) {
        const x = graphLeft + (i / Math.max(minuteTicks, 1)) * graphWidth;
        doc.line(x, graphBottom, x, graphBottom + 5);
        doc.text(String(i), x, graphBottom + 14, { align: 'center' });
      }

      // Pause markers
      if (metrics.pauseSegments && metrics.pauseSegments.length) {
        metrics.pauseSegments.forEach((pause) => {
          const xStart = mapTimeToX(pause.startMs);
          const xEnd = mapTimeToX(pause.startMs + pause.durationMs);
          const width = Math.max(xEnd - xStart, 0);
          if (width > 0) {
            doc.setFillColor(230, 230, 230);
            doc.rect(xStart, graphTop, width, graphHeight, 'F');
          }
        });
      }

      // Typing speed line
      if (metrics.minuteByMinute.length) {
        doc.setDrawColor(37, 99, 235);
        doc.setLineWidth(1.2);
        metrics.minuteByMinute.forEach((wpm, idx) => {
          const minuteStart = idx * 60000;
          const minuteMid = Math.min(durationMs, minuteStart + 30000);
          const x = mapTimeToX(minuteMid);
          const y = mapWpmToY(wpm);
          if (idx === 0) {
            doc.line(x, y, x, y);
          } else {
            const prevStart = (idx - 1) * 60000;
            const prevMid = Math.min(durationMs, prevStart + 30000);
            const prevX = mapTimeToX(prevMid);
            const prevY = mapWpmToY(metrics.minuteByMinute[idx - 1]);
            doc.line(prevX, prevY, x, y);
          }
          doc.circle(x, y, 2, 'F');
        });
      } else {
        doc.text('No typing data to display.', graphLeft, graphTop + lineHeight);
      }

      // Legend
      const legendY = graphBottom + 28;
      doc.setDrawColor(37, 99, 235);
      doc.line(graphLeft, legendY, graphLeft + 20, legendY);
      doc.circle(graphLeft + 10, legendY, 2, 'F');
      doc.setDrawColor(0);
      doc.text('Typing speed (WPM)', graphLeft + 28, legendY + 4);

      doc.setFillColor(230, 230, 230);
      doc.rect(graphLeft + 180, legendY - 8, 20, 12, 'F');
      doc.text('Pause', graphLeft + 206, legendY + 4);

      doc.save('extensive-writing.pdf');
    });

    // Initialize size and count for empty state
    autoResize();
    updateCount();
  </script>
</body>
</html>
