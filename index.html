<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extensive Writing</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #d7dde5;
      --text: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 32px 20px;
      min-height: 100vh;
      overflow: hidden;
    }

    .version-badge {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.08);
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.02em;
      pointer-events: none;
      user-select: none;
    }

    .app {
      width: min(900px, 100%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
    }

    h1 {
      font-weight: 700;
      margin: 0 0 12px;
      text-align: center;
      letter-spacing: -0.01em;
    }

    .instructions {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
      flex: 0 0 auto;
    }

    .instructions ol {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
      line-height: 1.6;
    }

    .writing-area {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 32px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .writing-area.session-locked {
      opacity: 0.9;
    }

    .writing-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      min-height: 220px;
      max-height: 65vh;
      height: 100%;
      resize: none;
      overflow: auto;
      scroll-padding: 12px 0 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px 20px;
      font: 16px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
      flex: 1 1 auto;
    }

    textarea.session-locked {
      opacity: 0.65;
      cursor: not-allowed;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .footer-panel {
      display: flex;
      gap: 12px;
      align-items: stretch;
      flex-wrap: wrap;
      position: sticky;
      bottom: 0;
      padding-top: 4px;
      background: linear-gradient(180deg, rgba(248, 250, 252, 0) 0%, #f8fafc 32%);
      z-index: 2;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex: 0 0 auto;
      align-items: center;
      align-self: stretch;
      flex-wrap: wrap;
    }

    .actions .download-btn {
      flex: 1 1 auto;
      white-space: nowrap;
    }

    .counter-box {
      flex: 1 1 260px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 6px 18px rgba(15, 23, 42, 0.05);
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
    }

    .counter-label {
      color: var(--muted);
      font-weight: 500;
      margin-right: 8px;
    }

    .download-btn {
      flex: 0 0 auto;
      align-self: stretch;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
      transition: transform 120ms ease, box-shadow 150ms ease, background 120ms ease;
    }

    .download-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.28);
      background: #1d4ed8;
    }

    .download-btn:active {
      transform: translateY(0);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    @media (max-width: 640px) {
      body {
        padding: 28px 14px 48px;
      }

      .footer-panel {
        flex-direction: column;
      }

      .download-btn {
        width: 100%;
        text-align: center;
        padding: 14px;
      }
    }

    .session-finished-note {
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="version-badge" aria-hidden="true">v8</div>
  <div class="app">
    <h1>Extensive Writing</h1>
    <div class="instructions">
      <ol>
        <li>Write in the box below.</li>
        <li>Don't worry about grammar or spelling.</li>
      </ol>
    </div>

    <div class="writing-area">
      <label class="writing-label" for="writer">Start writing</label>
      <textarea
        id="writer"
        aria-label="Writing area"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="none"
        autocomplete="off"
        inputmode="text"
        data-gramm="false"
        data-gramm_editor="false"
        data-enable-grammarly="false"
        data-lt-active="false"
        placeholder="Your thoughts go here..."
      ></textarea>

      <div class="session-finished-note" id="session-finished-note" aria-live="polite" hidden>
        The session finished. To start a new writing session, refresh the page.
      </div>

      <div class="footer-panel">
        <div class="counter-box" aria-live="polite">
          <span class="counter-label">Words</span>
          <span id="word-count">0</span>
        </div>
        <div class="actions">
          <button class="download-btn" id="finish-session">Finish session</button>
          <button class="download-btn" id="download">Download</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const textarea = document.getElementById('writer');
    const wordCountEl = document.getElementById('word-count');
    const downloadBtn = document.getElementById('download');
    const finishBtn = document.getElementById('finish-session');
    const finishedNote = document.getElementById('session-finished-note');
    const writingArea = document.querySelector('.writing-area');

    let sessionState = 'idle';
    let sessionEndTime = null;

    const disableCheckers = (node) => {
      if (!node) return;
      node.setAttribute('spellcheck', 'false');
      node.setAttribute('autocorrect', 'off');
      node.setAttribute('autocapitalize', 'none');
      node.setAttribute('autocomplete', 'off');
      node.setAttribute('inputmode', 'text');
      node.setAttribute('data-gramm', 'false');
      node.setAttribute('data-gramm_editor', 'false');
      node.setAttribute('data-enable-grammarly', 'false');
      node.setAttribute('data-lt-active', 'false');
      node.spellcheck = false;
      node.autocapitalize = 'none';
      node.autocomplete = 'off';
    };

    const getMaxEditorHeight = () => {
      const writingArea = document.querySelector('.writing-area');
      const available = writingArea ? Math.max(writingArea.clientHeight - 90, 220) : 220;
      const viewportLimit = window.innerHeight * 0.65;
      return Math.max(220, Math.min(viewportLimit, available));
    };

    const autoResize = () => {
      const maxHeight = getMaxEditorHeight();
      textarea.style.maxHeight = `${maxHeight}px`;
      textarea.style.height = 'auto';
      const nextHeight = Math.min(Math.max(textarea.scrollHeight, Math.min(220, maxHeight)), maxHeight);
      textarea.style.height = `${nextHeight}px`;
    };

    const countWords = (text) => {
      const words = text
        .trim()
        .split(/\s+/)
        .filter(Boolean);
      return words.length;
    };

    const isSessionFinished = () => sessionState === 'finished';

    const logging = (() => {
      const eventLog = [];
      let sessionStarted = false;
      let sessionStartTime = 0;
      let lastTextChangeTime = 0;
      let lastValue = textarea.value;
      let pasteEvents = 0;
      let pastedCharacters = 0;
      let backspaceCount = 0;
      let deleteCount = 0;
      let totalAddedChars = 0;
      let totalDeletedChars = 0;
      let charsTypedExcludingPaste = 0;
      const minuteBuckets = new Map();
      const pauseSegments = [];
      let awayPauseStart = null;
      const pasteMoments = [];
      const correctionMoments = [];

      const allowedKeys = new Set([
        'Backspace',
        'Delete',
        'Enter',
        ' ',
        'Tab',
        'ArrowLeft',
        'ArrowRight',
        'ArrowUp',
        'ArrowDown',
      ]);

      const shortcutKeys = new Set(['c', 'x', 'v', 'z', 'y', 'a']);

      const ensureSessionStarted = (timestamp) => {
        if (sessionStarted || isSessionFinished()) return;
        sessionStarted = true;
        sessionStartTime = timestamp;
        lastTextChangeTime = 0;
        sessionEndTime = null;
        sessionState = 'active';
      };

      const relativeTime = () => (sessionStarted ? performance.now() - sessionStartTime : 0);

      const logEvent = (entry) => {
        if (!sessionStarted || isSessionFinished()) return;
        eventLog.push({
          t: Number(relativeTime().toFixed(2)),
          ...entry,
        });
      };

      const recordPause = (pauseType, startTime, durationMs) => {
        if (!sessionStarted || isSessionFinished()) return;
        const durationRounded = Math.round(durationMs);
        const startMs = Math.max(0, Math.round(startTime - sessionStartTime));
        pauseSegments.push({ startMs, durationMs: durationRounded, type: pauseType });
        logEvent({
          type: 'pause',
          data: {
            durationMs: durationRounded,
            startMs,
            pauseType,
          },
        });
      };

      const handleWritingPauseCheck = (timestamp) => {
        if (!sessionStarted || isSessionFinished()) return;
        if (awayPauseStart !== null) {
          lastTextChangeTime = timestamp;
          return;
        }
        if (!lastTextChangeTime) {
          lastTextChangeTime = timestamp;
          return;
        }
        const delta = timestamp - lastTextChangeTime;
        if (delta >= 2000) {
          recordPause('writing_pause', lastTextChangeTime, delta);
        }
        lastTextChangeTime = timestamp;
      };

      const startAwayPause = (timestamp) => {
        if (!sessionStarted || awayPauseStart !== null || isSessionFinished()) return;
        awayPauseStart = timestamp;
      };

      const endAwayPause = (timestamp) => {
        if (!sessionStarted || awayPauseStart === null || isSessionFinished()) return;
        const duration = timestamp - awayPauseStart;
        if (duration >= 2000) {
          recordPause('away_pause', awayPauseStart, duration);
        }
        awayPauseStart = null;
        lastTextChangeTime = timestamp;
      };

      const handleKeydown = (event) => {
        if (isSessionFinished()) return;

        const isCharacter = event.key.length === 1 && !event.ctrlKey && !event.metaKey;
        const isTrackedKey = isCharacter || allowedKeys.has(event.key);
        const isShortcut = (event.ctrlKey || event.metaKey) && shortcutKeys.has(event.key.toLowerCase());
        if (!(isTrackedKey || isShortcut)) return;

        if (!sessionStarted) return;

        logEvent({
          type: 'keydown',
          data: {
            key: event.key,
            code: event.code,
            ctrl: event.ctrlKey,
            meta: event.metaKey,
            alt: event.altKey,
            shift: event.shiftKey,
            shortcut: isShortcut,
          },
        });

        if (isShortcut) {
          const key = event.key.toLowerCase();
          const actionMap = {
            c: 'copy',
            x: 'cut',
            v: 'paste',
            z: 'undo',
            y: 'redo',
            a: 'select_all',
          };
          const action = actionMap[key];
          if (action) {
            logEvent({
              type: 'shortcut',
              data: { action },
            });
          }
        }
      };

      const handleInput = (event) => {
        if (isSessionFinished()) {
          lastValue = textarea.value;
          return;
        }

        if (!['insertText', 'deleteContentBackward', 'deleteContentForward', 'insertFromPaste', 'insertLineBreak', 'insertParagraph'].includes(event.inputType)) {
          lastValue = textarea.value;
          return;
        }

        const nowTime = performance.now();
        const previousValue = lastValue;
        const currentValue = textarea.value;
        const added = Math.max(currentValue.length - previousValue.length, 0);
        const removed = Math.max(previousValue.length - currentValue.length, 0);

        if (!sessionStarted) {
          if (added > 0 || event.inputType === 'insertLineBreak' || event.inputType === 'insertParagraph') {
            ensureSessionStarted(nowTime);
          } else {
            lastValue = currentValue;
            return;
          }
        }

        if (!sessionStarted) {
          lastValue = currentValue;
          return;
        }

        if (awayPauseStart !== null) {
          endAwayPause(nowTime);
        }

        if (added === 0 && removed === 0) {
          lastValue = currentValue;
          return;
        }

        handleWritingPauseCheck(nowTime);

        const relativeEventMs = Math.max(0, nowTime - sessionStartTime);

        logEvent({
          type: 'input',
          data: {
            inputType: event.inputType,
            added,
            removed,
          },
        });

        totalAddedChars += added;
        totalDeletedChars += removed;

        if (event.inputType === 'insertFromPaste') {
          pasteEvents += 1;
          pastedCharacters += added;
          pasteMoments.push(relativeEventMs);
        } else if (added > 0) {
          charsTypedExcludingPaste += added;
          const minuteIndex = Math.floor((nowTime - sessionStartTime) / 60000);
          const prevChars = minuteBuckets.get(minuteIndex) || 0;
          minuteBuckets.set(minuteIndex, prevChars + added);
        }

        if (event.inputType === 'deleteContentBackward' && removed > 0) {
          backspaceCount += 1;
          correctionMoments.push({ timeMs: relativeEventMs, amount: removed });
        }
        if (event.inputType === 'deleteContentForward' && removed > 0) {
          deleteCount += 1;
          correctionMoments.push({ timeMs: relativeEventMs, amount: removed });
        }

        lastValue = currentValue;
      };

      const handleFocus = (type) => {
        if (isSessionFinished()) return;
        logEvent({ type, data: {} });
      };

      const computeMinuteWpm = (durationMs) => {
        if (!sessionStarted) return [];
        const totalMinutes = Math.max(Math.ceil(durationMs / 60000), 1);
        const result = [];
        for (let i = 0; i < totalMinutes; i += 1) {
          const charsTyped = minuteBuckets.get(i) || 0;
          const minuteStart = i * 60000;
          const minuteEnd = Math.min((i + 1) * 60000, durationMs);
          const minuteDuration = Math.max(minuteEnd - minuteStart, 1);
          const wordsFromChars = charsTyped / 5;
          const wpm = wordsFromChars / (minuteDuration / 60000);
          result.push(Number(wpm.toFixed(2)));
        }
        return result;
      };

      const getMetrics = () => {
        if (awayPauseStart !== null && !isSessionFinished()) {
          endAwayPause(performance.now());
        }
        const nowTime = sessionEndTime !== null ? sessionEndTime : performance.now();
        const durationMs = sessionStarted ? nowTime - sessionStartTime : 0;
        const totalWords = countWords(textarea.value);
        const totalCharsTyped = totalAddedChars;
        const totalPauses = pauseSegments;
        const pauseDurations = totalPauses.map((p) => p.durationMs || 0);
        const totalPausedTime = pauseDurations.reduce((a, b) => a + b, 0);
        const averagePause = pauseDurations.length ? totalPausedTime / pauseDurations.length : 0;
        const longestPause = pauseDurations.length ? Math.max(...pauseDurations) : 0;
        const minuteByMinute = computeMinuteWpm(durationMs);
        return {
          durationMs,
          totalCharsTyped,
          charsTypedExcludingPaste,
          deletedCharacters: totalDeletedChars,
          totalWords,
          finalCharacters: textarea.value.length,
          overallWpm: durationMs > 0 ? Number((totalWords / (durationMs / 60000)).toFixed(2)) : 0,
          minuteByMinute,
          backspaceCount,
          deleteCount,
          correctionRatio: charsTypedExcludingPaste > 0 ? Number(((totalDeletedChars / charsTypedExcludingPaste) * 100).toFixed(2)) : 0,
          pasteEvents,
          pastedCharacters,
          pastePercentage: totalCharsTyped > 0 ? Number(((pastedCharacters / totalCharsTyped) * 100).toFixed(2)) : 0,
          pauseCount: totalPauses.length,
          averagePause,
          longestPause,
          totalPausedTime,
          pauseSegments,
          pasteMoments: [...pasteMoments],
          correctionMoments: [...correctionMoments],
        };
      };

      const finalize = (timestamp) => {
        const nowTs = timestamp ?? performance.now();
        if (sessionEndTime === null) {
          sessionEndTime = nowTs;
        }
        if (sessionStarted && awayPauseStart !== null) {
          const duration = sessionEndTime - awayPauseStart;
          if (duration >= 2000) {
            recordPause('away_pause', awayPauseStart, duration);
          }
          awayPauseStart = null;
        }
      };

      const init = () => {
        textarea.addEventListener('keydown', handleKeydown, true);
        textarea.addEventListener('input', handleInput);
        textarea.addEventListener('focus', () => handleFocus('focus_gained'));
        textarea.addEventListener('blur', () => handleFocus('focus_lost'));
        document.addEventListener('visibilitychange', () => {
          const now = performance.now();
          if (document.hidden) {
            startAwayPause(now);
          } else {
            endAwayPause(now);
          }
        });
        window.addEventListener('blur', () => startAwayPause(performance.now()));
        window.addEventListener('focus', () => endAwayPause(performance.now()));
      };

      return { init, getMetrics, finalize };
    })();

    const updateCount = () => {
      const total = countWords(textarea.value);
      wordCountEl.textContent = total.toLocaleString('en');
    };

    const generateSessionSummary = (metrics) => {
      const minutes = Math.round(metrics.durationMs / 60000);
      const words = metrics.totalWords;
      const wpm = metrics.overallWpm;

      let speedSentence = '';
      if (wpm < 35) {
        speedSentence = 'This speed is a little slower than average.';
      } else if (wpm <= 40) {
        speedSentence = 'This speed is close to average.';
      } else {
        speedSentence = 'This speed is a little faster than average.';
      }

      const minuteSpeeds = metrics.minuteByMinute || [];
      const chunkSize = Math.max(1, Math.floor(minuteSpeeds.length / 3));
      const firstThird = minuteSpeeds.slice(0, chunkSize);
      const lastThird = minuteSpeeds.slice(-chunkSize);
      const avg = (arr) => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0);
      const flowSentence = (() => {
        const firstAvg = avg(firstThird);
        const lastAvg = avg(lastThird);
        if (firstAvg < lastAvg) return 'Your typing started slowly and became faster as the session continued.';
        if (firstAvg > lastAvg) return 'Your typing started quickly and became slower later in the session.';
        return 'Your typing speed stayed mostly consistent throughout the session.';
      })();

      const pauseCount = metrics.pauseCount;
      let pauseDetail = '';
      if (metrics.pauseSegments && metrics.pauseSegments.length) {
        const longest = metrics.pauseSegments.reduce((max, p) => (p.durationMs > max.durationMs ? p : max), metrics.pauseSegments[0]);
        if ((longest.durationMs || 0) >= 10000) {
          const minuteMark = Math.round((longest.startMs || 0) / 60000);
          pauseDetail = longest.type === 'away_pause'
            ? `There was a long pause around the ${minuteMark} minute mark while you were away from the writing window.`
            : `There was a long pause around the ${minuteMark} minute mark.`;
        }
      }

      const corrections = metrics.backspaceCount + metrics.deleteCount;

      let pasteSentence = '';
      if (metrics.pasteEvents && metrics.pasteEvents > 0) {
        const mark = metrics.pasteMoments && metrics.pasteMoments.length
          ? Math.round(metrics.pasteMoments[0] / 60000)
          : 0;
        pasteSentence = `You pasted text ${metrics.pasteEvents} time(s), including a larger paste around the ${mark} minute mark.`;
      }

      const sentences = [
        `During this writing session, you wrote for about ${minutes} minutes and finished with ${words} words. That is an average typing speed of ${wpm} words per minute.`,
        speedSentence,
        flowSentence,
        `You paused ${pauseCount} times while writing.`,
      ];

      if (pauseDetail) sentences.push(pauseDetail);
      sentences.push(`You used backspace and delete ${corrections} times to revise your text.`);
      if (pasteSentence) sentences.push(pasteSentence);
      sentences.push('Every writing session looks different. This record only shows what happened during this writing session.');

      return sentences.join(' ');
    };

    textarea.addEventListener('input', () => {
      autoResize();
      updateCount();
    });

    textarea.addEventListener('focus', () => disableCheckers(textarea));
    disableCheckers(textarea);

    const { jsPDF } = window.jspdf || {};

    logging.init();

    window.addEventListener('resize', autoResize);

    const applyFinishedState = () => {
      textarea.readOnly = true;
      textarea.setAttribute('aria-readonly', 'true');
      textarea.classList.add('session-locked');
      if (writingArea) {
        writingArea.classList.add('session-locked');
      }
      if (finishedNote) {
        finishedNote.hidden = false;
      }
    };

    const finishSession = () => {
      if (sessionState === 'finished') return;
      const confirmed = window.confirm(
        'Finishing the session will stop the writing timer and lock your text. You can still download your file.'
      );
      if (!confirmed) return;
      const now = performance.now();
      logging.finalize(now);
      if (sessionEndTime === null) {
        sessionEndTime = now;
      }
      sessionState = 'finished';
      applyFinishedState();
      textarea.blur();
    };

    if (finishBtn) {
      finishBtn.addEventListener('click', finishSession);
    }

    downloadBtn.addEventListener('click', () => {
      if (!jsPDF) {
        alert('PDF library failed to load. Please try again.');
        return;
      }

      const metrics = logging.getMetrics();
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });
      const margin = 40;
      const lineHeight = 18;
      const maxWidth = doc.internal.pageSize.getWidth() - margin * 2;
      const pageHeight = doc.internal.pageSize.getHeight();

      const text = textarea.value || '';
      const wordTotal = countWords(text);

      const lines = doc.splitTextToSize(text || ' ', maxWidth);
      let cursorY = margin;

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.text('Extensive Writing', margin, cursorY);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(12);
      cursorY += lineHeight * 1.6;

      doc.text(`Words: ${wordTotal}`, margin, cursorY);
      cursorY += lineHeight * 1.4;

      lines.forEach((line) => {
        if (cursorY > doc.internal.pageSize.getHeight() - margin) {
          doc.addPage();
          cursorY = margin;
        }
        doc.text(line, margin, cursorY);
        cursorY += lineHeight;
      });

      doc.addPage();
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.text('Session Report', margin, margin);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(12);
      let reportY = margin + lineHeight * 1.5;

      const formatDuration = (ms) => {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      };

      const formatSeconds = (ms) => `${(ms / 1000).toFixed(1)}s`;

      const summaryText = generateSessionSummary(metrics);
      const summaryLines = doc.splitTextToSize(summaryText, maxWidth);
      summaryLines.forEach((line) => {
        if (reportY > pageHeight - margin) {
          doc.addPage();
          reportY = margin;
        }
        doc.text(line, margin, reportY);
        reportY += lineHeight;
      });
      reportY += lineHeight * 0.5;

      const linesReport = [
        `Total time: ${formatDuration(metrics.durationMs)}`,
        `Total words: ${metrics.totalWords}`,
        `Overall WPM: ${metrics.overallWpm}`,
        `Backspace count: ${metrics.backspaceCount}`,
        `Delete count: ${metrics.deleteCount}`,
        `Corrections ratio: ${metrics.correctionRatio}%`,
        `Paste events: ${metrics.pasteEvents}`,
        `Pasted characters: ${metrics.pastedCharacters}`,
        `Paste percentage: ${metrics.pastePercentage}%`,
        `Pauses: ${metrics.pauseCount}`,
        `Average pause: ${formatSeconds(metrics.averagePause)}`,
        `Longest pause: ${formatSeconds(metrics.longestPause)}`,
        `Total paused time: ${formatSeconds(metrics.totalPausedTime)}`,
      ];

      linesReport.forEach((line) => {
        if (reportY > pageHeight - margin) {
          doc.addPage();
          reportY = margin;
        }
        doc.text(line, margin, reportY);
        reportY += lineHeight;
      });

      reportY += lineHeight * 0.5;
      const renderTableRow = (text) => {
        if (reportY > pageHeight - margin) {
          doc.addPage();
          reportY = margin;
        }
        doc.text(text, margin, reportY);
        reportY += lineHeight;
      };

      doc.setFont('helvetica', 'bold');
      doc.text('Minute-by-minute WPM', margin, reportY);
      doc.setFont('helvetica', 'normal');
      reportY += lineHeight;

      const tableHeaders = ['Minute', 'WPM'];
      renderTableRow(`${tableHeaders[0]} | ${tableHeaders[1]}`);

      metrics.minuteByMinute.forEach((value, index) => {
        renderTableRow(`${index + 1} | ${value}`);
      });

      doc.addPage();
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.text('Writing Timeline', margin, margin);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(12);

      const graphTop = margin + lineHeight * 1.5;
      const graphHeight = 240;
      const graphLeft = margin;
      const graphWidth = doc.internal.pageSize.getWidth() - margin * 2;
      const graphBottom = graphTop + graphHeight;
      const durationMs = Math.max(metrics.durationMs, 1);
      const durationMinutes = durationMs / 60000;
      const mapTimeToX = (timeMs) => graphLeft + (Math.min(timeMs, durationMs) / durationMs) * graphWidth;

      const COLORS = {
        wpmBlue: [37, 99, 235],
        writingPauseYellow: [250, 204, 21],
        awayPauseOrange: [249, 115, 22],
        correctionGreen: [34, 197, 94],
        pasteGray: [107, 114, 128],
      };

      const maxWpm = metrics.minuteByMinute.length ? Math.max(...metrics.minuteByMinute) : 0;
      const yMax = Math.max(Math.ceil(maxWpm / 10) * 10 || 10, 10);
      const mapWpmToY = (wpm) => graphBottom - (Math.min(wpm, yMax) / yMax) * graphHeight;

      const getWpmAtTime = (timeMs) => {
        if (!metrics.minuteByMinute.length) return 0;
        const minuteIndex = Math.min(
          metrics.minuteByMinute.length - 1,
          Math.floor(timeMs / 60000)
        );
        return metrics.minuteByMinute[minuteIndex] || 0;
      };

      // Pause markers (writing vs away) drawn first behind axes/lines
      if (metrics.pauseSegments && metrics.pauseSegments.length) {
        metrics.pauseSegments.forEach((pause) => {
          const xStart = mapTimeToX(pause.startMs);
          const xEnd = mapTimeToX(pause.startMs + pause.durationMs);
          const width = Math.max(xEnd - xStart, 0);
          if (width > 0) {
            if (pause.type === 'away_pause') {
              doc.setFillColor(...COLORS.awayPauseOrange);
            } else {
              doc.setFillColor(...COLORS.writingPauseYellow);
            }
            doc.rect(xStart, graphTop, width, graphHeight, 'F');
          }
        });
      }

      // Axes
      doc.setDrawColor(0, 0, 0);
      doc.setLineWidth(1.2);
      doc.line(graphLeft, graphTop, graphLeft, graphBottom);
      doc.line(graphLeft, graphBottom, graphLeft + graphWidth, graphBottom);

      // Y-axis ticks
      const yTicks = 5;
      for (let i = 0; i <= yTicks; i += 1) {
        const value = (yMax / yTicks) * i;
        const y = mapWpmToY(value);
        doc.line(graphLeft - 5, y, graphLeft, y);
        doc.text(String(Math.round(value)), graphLeft - 10, y + 4, { align: 'right' });
      }

      // X-axis ticks
      const minuteTicks = Math.max(Math.ceil(durationMinutes), 1);
      for (let i = 0; i <= minuteTicks; i += 1) {
        const x = graphLeft + (i / Math.max(minuteTicks, 1)) * graphWidth;
        doc.line(x, graphBottom, x, graphBottom + 5);
        doc.text(String(i), x, graphBottom + 14, { align: 'center' });
      }

      // Typing speed line
      if (metrics.minuteByMinute.length) {
        doc.setDrawColor(...COLORS.wpmBlue);
        doc.setLineWidth(3);
        doc.setFillColor(...COLORS.wpmBlue);
        metrics.minuteByMinute.forEach((wpm, idx) => {
          const minuteStart = idx * 60000;
          const minuteMid = Math.min(durationMs, minuteStart + 30000);
          const x = mapTimeToX(minuteMid);
          const y = mapWpmToY(wpm);
          if (idx === 0) {
            doc.line(x, y, x, y);
          } else {
            const prevStart = (idx - 1) * 60000;
            const prevMid = Math.min(durationMs, prevStart + 30000);
            const prevX = mapTimeToX(prevMid);
            const prevY = mapWpmToY(metrics.minuteByMinute[idx - 1]);
            doc.line(prevX, prevY, x, y);
          }
          doc.circle(x, y, 3.2, 'F');
        });
      } else {
        doc.text('No typing data to display.', graphLeft, graphTop + lineHeight);
      }

      // Paste markers (on WPM line)
      if (metrics.pasteMoments && metrics.pasteMoments.length) {
        doc.setFillColor(...COLORS.pasteGray);
        doc.setDrawColor(...COLORS.pasteGray);
        doc.setLineWidth(1.2);
        metrics.pasteMoments.forEach((timeMs) => {
          const x = mapTimeToX(timeMs);
          const y = mapWpmToY(getWpmAtTime(timeMs));
          doc.circle(x, y, 3.0, 'F');
        });
      }

      // Correction intensity markers (on WPM line)
      if (metrics.correctionMoments && metrics.correctionMoments.length) {
        const maxCorrection = Math.max(...metrics.correctionMoments.map((c) => c.amount || 0), 1);
        doc.setFillColor(...COLORS.correctionGreen);
        doc.setDrawColor(...COLORS.correctionGreen);
        doc.setLineWidth(1.1);
        metrics.correctionMoments.forEach((c) => {
          const x = mapTimeToX(c.timeMs);
          const y = mapWpmToY(getWpmAtTime(c.timeMs));
          const radius = 1.8 + ((c.amount || 0) / maxCorrection) * 0.4;
          doc.circle(x, y, radius, 'F');
        });
      }

      // Legend
      const legendY = graphBottom + 28;
      doc.setDrawColor(...COLORS.wpmBlue);
      doc.setLineWidth(3);
      doc.line(graphLeft, legendY, graphLeft + 20, legendY);
      doc.setFillColor(...COLORS.wpmBlue);
      doc.circle(graphLeft + 10, legendY, 3.2, 'F');
      doc.setLineWidth(1.2);
      doc.setDrawColor(0);
      doc.text('Typing speed (WPM)', graphLeft + 28, legendY + 4);

      doc.setFillColor(...COLORS.writingPauseYellow);
      doc.rect(graphLeft + 180, legendY - 8, 20, 12, 'F');
      doc.text('Writing pause', graphLeft + 206, legendY + 4);

      doc.setFillColor(...COLORS.awayPauseOrange);
      doc.rect(graphLeft + 320, legendY - 8, 20, 12, 'F');
      doc.text('Away pause', graphLeft + 346, legendY + 4);

      doc.setFillColor(...COLORS.pasteGray);
      doc.setDrawColor(...COLORS.pasteGray);
      doc.circle(graphLeft + 190, legendY + 20, 3.0, 'F');
      doc.setDrawColor(0);
      doc.text('Paste', graphLeft + 206, legendY + 24);

      doc.setFillColor(...COLORS.correctionGreen);
      doc.setDrawColor(...COLORS.correctionGreen);
      doc.circle(graphLeft + 330, legendY + 20, 1.8, 'F');
      doc.setDrawColor(0);
      doc.text('Corrections', graphLeft + 338, legendY + 24);

      doc.save('extensive-writing.pdf');
    });

    // Initialize size and count for empty state
    autoResize();
    updateCount();
  </script>
</body>
</html>
